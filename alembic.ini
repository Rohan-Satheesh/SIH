; ORCA / NeerMitra — Alembic configuration
;
; The database URL is intentionally NOT hardcoded here. `alembic/env.py`
; reads it from `server.src.config.settings.DATABASE_URL` (which itself
; reads the `DATABASE_URL` environment variable), so this file works
; unmodified in every environment (local dev, Render, CI) as long as that
; environment variable is set correctly.
;
; Run all alembic commands from the repository root, e.g.:
;   alembic upgrade head
;   alembic revision --autogenerate -m "add new table"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
