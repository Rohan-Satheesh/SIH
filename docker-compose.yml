version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: neermitra_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neermitra_spatial
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
